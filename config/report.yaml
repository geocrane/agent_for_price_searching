# Итоговый Excel-отчёт и комментарий по источникам (search_agent/report/).
#
# Файла раньше не существовало: `load_settings` его читал, но при отсутствии молча брал дефолты
# из кода (config.py, ReportConfig). Менять поведение можно было только правкой кода или флагом
# CLI `--no-model`. Теперь всё видно и правится здесь.

# Комментарий по каждой позиции пишет МОДЕЛЬ (сравнение источников, оговорки про единицу).
# false — всегда детерминированная сводка по данным отбора.
#
# ВАЖНО: даже при true комментарий может оказаться сводкой — если модель не ответила. Кто именно
# написал текст, видно в отчёте: колонка «Комментарий составлен» («модель» / «сводка (…)»).
# На прогоне 09.08 сводкой оказались 42% комментариев (206 отказов 429 и 5 таймаутов),
# и отличить их было невозможно.
use_model: true

max_offers_in_comment: 8      # сколько предложений перечислять модели и в сводке
include_excluded: true        # упоминать отсеянные значения (приманки/выбросы) с причиной
concurrency: 4                # параллельных комментариев (общий лимит запросов держит config/llm.yaml)
max_chars: 700                # предел длины комментария: длинный ответ модели обрезаем

# Сколько ждать комментарий ПО ХОДУ ПРОГОНА. Дольше ждать нечего: комментарий — не цена,
# при таймауте берётся сводка, а прогон идёт дальше. Ожидание паузы модели по лимиту API
# сюда не входит — им управляет config/llm.yaml (degrade_after_s).
rationale_timeout: 60.0

# Промежуточные сохранения: на файле в 500 позиций сбой на четвёртом часу не должен обнулять работу.
checkpoint_every: 10          # через сколько закрытых позиций перезаписывать файлы (0 — выключить)
checkpoint_dir: results       # папка в корне инструмента; внутри — подпапка на прогон
