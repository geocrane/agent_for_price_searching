# Сценарий очистки контента страницы перед LLM (по умолчанию = пресет "balanced").
# Приоритет — не потерять цену: блоки с ценовым токеном не удаляются. Структурные сигналы
# (JSON-LD/microdata/meta) от сценария НЕ зависят — извлекаются всегда. UI переопределяет per-run.
strip_link_urls: true        # <a> → его текст (URL убираем): объём ×0.5, цена не теряется
drop_structural: true        # удалять nav/aside/header/footer ТОЛЬКО если внутри нет цены
drop_structural_force: false # удалять эти блоки безусловно (агрессивно, риск потери цены)
remove_cookie_banner: true   # удалять cookie/consent/gdpr-баннеры
link_density_prune: false    # удалять div-«меню» без семантики (доля текста-в-ссылках >0.8 и нет цены)
max_chars: 60000             # верхний предел размера Markdown (страховка)
