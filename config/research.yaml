# Чат-исследователь (M9): цены, сравнения по обзорам и разведка источников данных.
# Значения по умолчанию совпадают с ResearchConfig в search_agent/config.py — этот файл нужен,
# чтобы менять бюджеты без правки кода. Пустые/лишние ключи игнорируются.

# Бюджеты на ОДИН ход диалога (одно сообщение пользователя). Средний профиль: хватает на
# «найти цены в 3-4 магазинах + прочитать пару обзоров + свести», либо на разведку 4-6 источников.
max_steps: 16
search_budget: 5          # web_search + find_sources
read_budget: 8            # чтение страниц
probe_budget: 6           # аттестация источников данных (probe_source)
extract_budget: 6         # извлечение цен со страницы
escalate_budget: 3        # обходы антибота
probe_links: 3            # внутренних ссылок обойти при проверке источника

# Контекст диалога. Тяжёлый контент через модель не гоняем: страницы лежат в runs/fetch_cache,
# в диалог попадает только выжимка.
obs_max_chars: 1200
excerpt_max_chars: 3000
max_sources: 20
keep_steps: 12            # последние N шагов держим дословно, старые — одной строкой

# Дисциплина качества. Выключать только осознанно:
#   verify_with_model=false → разведка выродится в пересказ поисковой выдачи;
#   fix_citations=false     → утверждения без ссылок пойдут пользователю как есть.
verify_with_model: true
fix_citations: true
