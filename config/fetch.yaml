# Настройки загрузки страниц (M3a). Приоритет — надёжность, но не ценой пустого ожидания.
backend: "browser"          # browser (Playwright, надёжно) | http (httpx, быстрее)
http_first: true            # сначала лёгкий httpx; браузер — только если пришёл блок, пустая
                            # страница или оболочка SPA (решение по результату, не по списку сайтов)
headed: false               # окно браузера ВИДНО. false — Chrome работает фоном, окна на экране
                            # нет (это не значит, что браузер не открывался: см. `via=browser` в
                            # логе). Раньше здесь стоял ключ `headless`, которого в настройках не
                            # существует: он молча отбрасывался, и правка ничего не меняла.
timeout: 30.0               # сек на загрузку страницы
delay_range: [8.0, 25.0]    # интервал МЕЖДУ ЗАПРОСАМИ К ОДНОМУ ДОМЕНУ (первый заход не ждёт:
                            # пауза защищает от частых обращений к одному сайту, а не от загрузки)
top_n_fetch: 0              # 0 = грузить ВСЕХ кандидатов выдачи (без обрезки)
concurrency: 2              # параллелизм между доменами (в один домен — всё равно по одному)
retry_on_block: 1           # повторов при мягком блоке (капча/429) после cooldown
cooldown_range: [20.0, 40.0]
warmup: true                # перед ПОВТОРОМ после блока зайти на главную домена (куки)
