# Движок «Найти»: сколько ПОЗИЦИЙ обрабатывается одновременно на каждом этапе конвейера.
# Этапы: поиск источников (discover) → загрузка сайтов (fetch) → триаж (inspect) →
# поиск карточки (find_link) / эскалация (escalate) → извлечение цены моделью (extract).
#
# Лимит стоит на КАЖДОМ этапе отдельно, а очередь на вход в этап — по НОМЕРУ СТРОКИ, а не по
# времени прихода задачи. Смысл именно в порядке: раньше позиция №10 успевала получить цену, пока
# №2 и №3 стояли в очереди за вкладкой браузера, — теперь ранняя позиция никогда не ждёт позднюю.
# Реализация — search_agent/agent/gates.py (RowGate).

stage_positions: 5              # позиций одновременно на каждом этапе

# Точечные переопределения по этапу (пусто — у всех stage_positions).
# extract: 10 — адаптивный исполнитель рассчитан на 8 одновременных вызовов модели
# (extract.concurrency), а при общем лимите в 5 позиций задач столько просто не набирается:
# модель половину времени простаивала бы, ожидая, пока освободится позиция.
stage_positions_by_kind:
  extract: 10

model_lanes: 1                  # полос модельной очереди оркестратора (модель отвечает серийно)
