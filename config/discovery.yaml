# Настройки обнаружения источников. Бэкенд один — Serper.dev (выдача Google через search-API).
timeout: 20                        # сек на один запрос к поисковому API
max_results: 20                    # сколько кандидатов брать из выдачи одного запроса

queries_per_item: 1                # вариантов запроса на товар. РОВНО ОДИН: название + артикул +
                                   # аффикс. Второй вариант (то же самое без аффикса) удваивал
                                   # число платных обращений к поиску, а выдачу почти не менял.
top_n: 0                           # 0 = рассматриваем ВСЮ выдачу, без ранжирования и обрезки.
                                   # Обрезка выбрасывала живые магазины ради маркетплейсов под
                                   # антиботом. >0 — аварийный лимит (сортировка по рангу, топ-N).
llm_queries_batch: 40              # позиций в ОДНОМ пакете при разборе наименований моделью.
                                   # Пакеты идут последовательно и целиком до начала поиска;
                                   # если модель не уложилась в таймаут — пакет дробится пополам.
concurrency: 4                     # товаров одновременно (search-API надёжен → можно параллелить)
default_affix: "цена купить"       # фраза-суффикс к наименованию, если не задана явно
