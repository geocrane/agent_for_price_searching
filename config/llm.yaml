# Лимиты вызовов модели и политика на отказ (search_agent/llm/limits.py).
#
# ЗАЧЕМ. Прогон 09.08 дал 1532 отказа 429 при том, что полезный трафик занимал всего 10%
# квоты токенов и 23% квоты запросов в минуту. Причина не в объёме, а в реакции на отказ:
# 429 возвращается за миллисекунды, слот освобождается мгновенно, туда встаёт следующая
# страница и получает отказ снова. Отклонённые запросы сервер тоже считает — шторм сам себя
# кормил два часа. Поэтому квота берётся ДО отправки, а на отказ отвечаем сном.
#
# Значения ниже паспортных намеренно: окна на сервере скользящие, а оценка токенов
# приблизительная. Запас дешевле, чем отказ.

rps: 3                  # запросов в секунду (паспорт провайдера — 4; единственный лимит,
                        # который мы реально пробивали: пиковые 9 запр/с)
rpm: 80                 # запросов в минуту (паспорт — 100; наш пик был 23)
tpm: 700000             # токенов в минуту (паспорт — 1 000 000; наш пик был 99 382)

# Верхняя граница генерации. Раньше не задавалась вовсе: без неё нельзя оценить резерв токенов
# ДО вызова, а часть ответов упиралась в таймаут 175 с.
#
# Значение НЕ занижать. У модели с рассуждением «размышления» тоже расходуют токены генерации:
# в прогоне 09.08 разбор пакета из 40 наименований стоил 11 449 токенов ответа, из них 9 451 —
# рассуждение. Обрезка ответа лимитом хуже, чем лишний резерв: обрезанный JSON не разбирается,
# страница считается пустой, а пакет разбора дробится и оплачивается заново.
# Реальные ответы прогона: медиана 917 токенов, p90 — 2297, максимум 7628 (4000 обрезали бы 3.5%).
# Разбор наименований запрашивает свой предел, по размеру пакета (discovery/query_llm.py).
max_tokens: 12000

# Повторы SDK ВЫКЛЮЧЕНЫ: они дублируют запрос мимо лимитера и удваивают нагрузку ровно в тот
# момент, когда сервер просит её снизить. Повторами управляет limits.LLMGateway.
max_retries: 0

overload_backoff: [2, 4, 8, 16, 32]   # с; берётся Retry-After, если сервер его прислал
overload_attempts: 6    # повторов одного вызова до признания модели недоступной
open_after: 3           # отказов подряд до ГЛОБАЛЬНОЙ паузы (вся работа встаёт, где стоит)
probe_every: 15.0       # период пробника доступности модели, с
degrade_after_s: 900    # предел терпения, с. 0 = ждать сколько угодно (ночной прогон).
                        # Только по его исчерпании разрешена деградация на структурные метки.
limits_up_after: 20     # успехов подряд до возврата суженных лимитов вверх
