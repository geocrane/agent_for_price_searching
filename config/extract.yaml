# Извлечение цены моделью со страницы (M4, шаг 1).
# Всё — структурные, универсальные параметры (не заточка под конкретный сайт).

max_chars: 24000                # символов Markdown в промпт: карточка целиком (приоритет качества).
                                # Нужен контекст модели ~16k+ токенов (у Qwen с n_ctx=70k — с запасом).
                                # Для модели с контекстом 8k снизьте до ~10000. Длинные страницы дороже по времени.
min_confidence: 0.0             # порог отбраковки записей по уверенности (0 = берём все)
include_structured_hint: false  # НЕ подавать метки в промпт: на листингах провоцируют галлюцинацию
                                # (модель берёт число из jsonld вместо текста). Метки остаются для деградации без модели.

# Адаптивный лимит вызовов модели (search_agent/llm/orchestrator.py). Прямой API держит
# параллель, но сбрасывает запрос при генерации >180 с. concurrency — ВЕРХНИЙ уровень (старт);
# ступени выводятся как (n, n//2, 1). При таймауте лимит падает и запрос повторяется, при серии
# успехов — растёт обратно. Для медленной серверной модели можно снизить старт до 4.
concurrency: 8                  # старт параллельности (8→4→1 по таймауту)
orch_timeout: 175.0             # таймаут одного вызова, с (сервер сбрасывает при >180 с)
orch_up_after: 8                # успехов подряд до повышения лимита вверх
