# Правила выбора ИТОГОВОЙ цены из всех найденных (search_agent/extract/adjudicate.py).
#
# Это бизнес-правила: по ним объясняют заказчику, почему в отчёте стоит именно это число.
# Их видно в отчёте — лист «Отбор» показывает по каждой цене, на каком шаге она выбыла и из каких
# слагаемых сложился её балл. Пороги ОТНОСИТЕЛЬНЫЕ (доля от медианы), поэтому работают на любом
# товаре без привязки к категории.
#
# Порядок отсева (номер шага виден в отчёте):
#   1 валюта   — цена в другой валюте, конверсию не делаем
#   2 единица  — цена за другую единицу («за м³» против «за блок»). Единицы сравниваются в каноне:
#                «шт.» и «шт» — одна величина (см. search_agent/extract/units.py)
#   3 аналог   — при наличии точных совпадений аналоги не рассматриваются
#   4 выброс   — приманка, опт или опечатка по порогам ниже
# Дошедшие до конца сравниваются по баллу.

# --- шаг 4: отсев выбросов ---
k_low: 0.15                   # ниже 15% медианы → приманка / цена за часть / образец
k_high: 6.0                   # выше 6 медиан → опт (за тонну, за поддон) или опечатка
mad_k: 4.0                    # порог устойчивой z-оценки (по MAD) для статистического выброса
min_n_for_mad: 4              # MAD включаем только когда цен достаточно (на 2-3 он бессмыслен)
min_n_for_corridor: 4         # срединный коридор для родовой позиции — тоже от 4 цен

# --- подтверждение ---
corroborate_rel: 0.05         # цены в пределах ±5% считаем одной и той же (для счёта доменов)

# --- веса балла (сумма ~1). Каждый показан в отчёте отдельным слагаемым ---
w_tier: 0.28                  # надёжность сайта (официальный дилер надёжнее агрегатора)
w_conf: 0.15                  # уверенность извлечения моделью
w_corr: 0.20                  # подтверждение независимыми доменами
w_match: 0.12                 # тип совпадения: точное — полный вес, аналог — половина
w_stock: 0.03                 # есть в наличии
w_median: 0.12                # близость к середине: одиночная крайность подозрительнее
w_vendor: 0.10                # сайт самого производителя — цена защищена от накрутки посредника

# --- множители доверия к итогу ---
non_offer_penalty: 0.6        # обзор или поисковая выдача: цена настоящая, но это не предложение
analog_only_penalty: 0.7      # точных совпадений не нашлось, итог собран по аналогам
tie_penalty: 0.85             # балл победителя совпал с соперником — выбор доопределён правилом

# Цена из структурной разметки, взятая когда модель была недоступна: соответствие товару НЕ
# проверял никто. Раньше такая цена помечалась «точное» и шла в свод с полным весом — на
# прогоне 09.08 так получились 32% цен отчёта и девять позиций с ценой в тысячи раз меньше
# настоящей. Теперь она заведомо слабее аналога и не может выглядеть надёжной.
unverified_match: 0.25        # вклад в балл (у точного — 1.0, у аналога — 0.5)
unverified_confidence: 0.3    # потолок доверия к итогу, который модель не проверяла

# Единица товара — та, за которую продают САМ товар, а не его аналоги. Поэтому доминирующую
# единицу считаем по точным совпадениям, если они есть. Предохранитель против реального случая:
# два аналога за «шт.» задали единицу и выбросили единственную точную цену за «шт» — в отчёт
# ушла цена чужого бренда (LTV RTM-085 00 → BOLID RGG-0822).
unit_by_exact: true
